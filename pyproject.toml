[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-stats-pitft"
version = "0.2.1"
description = "A tiny, navigable Jetson telemetry dashboard for an ST7789 Mini PiTFT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kevin Eales"}]
dependencies = ["Pillow>=9", "numpy>=1.23", "spidev>=3.5", "gpiod>=1.6,<2"]

[project.scripts]
jetson-stats-pitft = "jetson_stats_pitft.app:main"

[tool.setuptools]
packages = ["jetson_stats_pitft"]
